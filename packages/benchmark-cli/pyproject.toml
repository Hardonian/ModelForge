[project]
name = "modelforge"
version = "1.0.0"
description = "OpenComputeBench inference benchmark CLI and hardware intelligence runner"
readme = "README.md"
authors = [{ name = "ModelForge Team" }]
requires-python = ">=3.12"
dependencies = [
    "typer>=0.15.1",
    "rich>=13.9.4",
    "pydantic>=2.10.6",
    "httpx>=0.28.1",
    "psutil>=6.1.1",
    "pyyaml>=6.0.2",
]

[project.scripts]
modelforge = "modelforge.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.3.4",
    "ruff>=0.9.6",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "BLE001", "S110", "UP036", "E501", "B904"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
